<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <div class="board-column">
        <h1 class="game-title">TETRIS</h1>
        <canvas id="board" width="300" height="600"></canvas>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <button id="theme-toggle" type="button"></button>
        </div>
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="value combo-value hidden" id="combo"></span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div class="records-panel">
          <h2>Mejores puntuaciones</h2>
          <ol id="start-records-list" class="records-list"></ol>
          <p class="records-stats">Mejor combo: <span id="start-best-combo">-</span> · Líneas máx: <span id="start-max-lines">-</span></p>
        </div>
        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn-start" class="btn-secondary">Resetear records</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-entry" class="hidden">
          <p class="name-entry-label">¡Nueva puntuación en el top 5!</p>
          <div class="name-entry-row">
            <input id="player-name" type="text" maxlength="10" placeholder="Tu nombre" autocomplete="off" />
            <button id="save-record-btn">Guardar</button>
          </div>
        </div>

        <div id="overlay-records-panel" class="records-panel">
          <h2>Mejores puntuaciones</h2>
          <ol id="overlay-records-list" class="records-list"></ol>
          <p class="records-stats">Mejor combo: <span id="overlay-best-combo">-</span> · Líneas máx: <span id="overlay-max-lines">-</span></p>
        </div>

        <button id="restart-btn">Reiniciar</button>
        <button id="reset-records-btn-overlay" class="btn-secondary">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
