<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <div class="board-column">
        <h1 class="game-title">TETRIS</h1>
        <canvas id="board" width="300" height="600"></canvas>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <button id="theme-toggle" type="button"></button>
        </div>
        <div class="panel-section">
          <span class="label">SKIN</span>
          <div class="skin-buttons" role="group" aria-label="Tema visual">
            <button type="button" class="skin-btn" data-skin="retro">Retro</button>
            <button type="button" class="skin-btn" data-skin="neon">Neon</button>
            <button type="button" class="skin-btn" data-skin="pastel">Pastel</button>
            <button type="button" class="skin-btn" data-skin="pixel">Pixel Art</button>
          </div>
        </div>
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="value combo-value hidden" id="combo"></span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-overlay" class="overlay hidden">
      <div class="overlay-box pause-box">
        <p class="pause-title">PAUSA</p>

        <div id="pause-menu" class="pause-panel">
          <button id="resume-btn" class="menu-btn">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
          <button id="show-controls-btn" class="menu-btn">Ver controles</button>
          <div class="level-select-row">
            <label for="start-level-select">Nivel inicial</label>
            <select id="start-level-select"></select>
          </div>
        </div>

        <div id="pause-controls" class="pause-panel hidden">
          <ul class="pause-controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <button id="back-to-menu-btn" class="menu-btn">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
